# Builds the story with Tweego and publishes build/ to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tweego
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tweego.zip" https://github.com/tmedwards/tweego/releases/download/v2.1.1/tweego-2.1.1-linux-x64.zip
          # Only the binary: the release's bundled story formats are older than storyformats/sugarcube-2.
          unzip -q "$RUNNER_TEMP/tweego.zip" tweego -d "$RUNNER_TEMP/tweego"
          chmod +x "$RUNNER_TEMP/tweego/tweego"

      - name: Build
        run: TWEEGO="$RUNNER_TEMP/tweego/tweego" sh build.sh

      - name: Assemble site
        run: |
          mkdir _site
          cp -R build/. _site/
          cp build/atlantis-play.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
